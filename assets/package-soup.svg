<svg xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="256"
  viewBox="0 0 32 32"
  shape-rendering="crispEdges">

  <rect width="32" height="32" rx="3" fill="#E8F8C6"/>

  <!-- steam -->
  <rect x="10" y="3" width="2" height="2" fill="#52643F"/>
  <rect x="9" y="5" width="3" height="2" fill="#52643F"/>
  <rect x="10" y="7" width="2" height="2" fill="#D3FF75"/>

  <rect x="15" y="1" width="2" height="2" fill="#D3FF75"/>
  <rect x="14" y="3" width="3" height="2" fill="#D3FF75"/>
  <rect x="15" y="5" width="2" height="3" fill="#52643F"/>

  <rect x="20" y="4" width="2" height="2" fill="#52643F"/>
  <rect x="19" y="6" width="3" height="2" fill="#D3FF75"/>
  <rect x="20" y="8" width="2" height="1" fill="#52643F"/>

  <!-- handles -->
  <rect x="3" y="13" width="3" height="2" fill="#151D17"/>
  <rect x="2" y="15" width="2" height="4" fill="#151D17"/>
  <rect x="3" y="19" width="3" height="2" fill="#151D17"/>

  <rect x="26" y="13" width="3" height="2" fill="#151D17"/>
  <rect x="28" y="15" width="2" height="4" fill="#151D17"/>
  <rect x="26" y="19" width="3" height="2" fill="#151D17"/>

  <!-- outer rim -->
  <rect x="8" y="9" width="16" height="1" fill="#151D17"/>
  <rect x="6" y="10" width="20" height="2" fill="#151D17"/>
  <rect x="5" y="12" width="22" height="4" fill="#151D17"/>

  <!-- potion -->
  <rect x="9" y="10" width="14" height="1" fill="#D3FF75"/>
  <rect x="7" y="11" width="18" height="2" fill="#D3FF75"/>
  <rect x="6" y="13" width="20" height="2" fill="#D3FF75"/>

  <!-- potion highlights -->
  <rect x="10" y="11" width="4" height="1" fill="#E8F8C6"/>
  <rect x="18" y="12" width="3" height="1" fill="#E8F8C6"/>

  <!-- front lip -->
  <rect x="5" y="15" width="22" height="2" fill="#151D17"/>
  <rect x="7" y="17" width="18" height="1" fill="#151D17"/>

  <!-- cauldron body -->
  <rect x="6" y="17" width="20" height="4" fill="#151D17"/>
  <rect x="7" y="21" width="18" height="3" fill="#151D17"/>
  <rect x="9" y="24" width="14" height="3" fill="#151D17"/>
  <rect x="11" y="27" width="10" height="1" fill="#151D17"/>

  <!-- restrained body highlight -->
  <rect x="8" y="18" width="5" height="1" fill="#52643F"/>
  <rect x="8" y="19" width="3" height="3" fill="#52643F"/>
  <rect x="10" y="22" width="4" height="1" fill="#52643F"/>

  <!-- feet -->
  <rect x="8" y="26" width="4" height="3" fill="#151D17"/>
  <rect x="20" y="26" width="4" height="3" fill="#151D17"/>
</svg>
